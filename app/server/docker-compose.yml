services:
client:
  build:
    context: ../client
    dockerfile: Dockerfile
    args:
      VITE_API_URL: /api
  ports:
    - '80:80'
    - '443:443'
  volumes:
    - /etc/letsencrypt/live/ludioquiz.duckdns.org/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
    - /etc/letsencrypt/live/ludioquiz.duckdns.org/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
  depends_on:
    - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: capyquiz
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine

volumes:
  mysql_data:
